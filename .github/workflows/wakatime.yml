name: WakaTime Readme

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wakatime.yml
      - .github/scripts/configure_wakapi_action.py

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the existing action
        uses: actions/checkout@v4
        with:
          repository: anmol098/waka-readme-stats
          ref: f3a05a90cddf436185171f5c2d91af3478fc10c3
          path: .waka-readme-stats
          persist-credentials: false

      - name: Configure private Wakapi authentication
        run: python3 .github/scripts/configure_wakapi_action.py .waka-readme-stats

      - uses: ./.waka-readme-stats
        env:
          # Validate pull requests without pushing a generated README to the main branch.
          DEBUG_RUN: ${{ github.event_name == 'pull_request' && 'True' || 'False' }}
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKAPI_API_KEY }}
          WAKATIME_API_URL: https://wakapi.smallshawn95.zip/api/compat/wakatime/v1/
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_UPDATED_DATE: "True"
          SHOW_LINES_OF_CODE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_COMMIT: "True"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          # Wakapi's compatibility response does not provide these WakaTime-specific AI fields.
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
